<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>叠叠乐大师 - Tower Stacker</title>
    <style>
        /* 基础重置与全局变量 */
        :root {
            --primary: #f4e434;
            --primary-dark: #ca8a04;
            --bg-sky: #bae6fd;
            --text-main: #0f172a;
            --font-stack: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-stack);
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* 游戏主容器 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: var(--bg-sky);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI 层样式 */
        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        [hidden] {
            display: none !important;
        }

        /* 顶部状态栏 (HUD) 样式 */
        .hud-container {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .badge {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 9999px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .badge-level {
            background: var(--primary);
            border-radius: 9999px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .badge-label {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        .badge-value {
            color: #1e293b;
            font-weight: 900;
            font-size: 18px;
            line-height: 1;
        }

        /* 界面屏幕样式 */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
        }

        .bg-blur-sky { background: rgba(12, 74, 110, 0.4); backdrop-filter: blur(4px); }
        .bg-blur-red { background: rgba(127, 17, 17, 0.6); backdrop-filter: blur(12px); }

        .title {
            font-size: 56px;
            font-weight: 900;
            color: white;
            line-height: 1.1;
            margin-bottom: 12px;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
            letter-spacing: -2px;
        }

        .title span { color: var(--primary); display: block; font-size: 64px; }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* 按钮样式 */
        .btn {
            background: var(--primary);
            color: #0f172a;
            font-weight: 900;
            font-size: 24px;
            padding: 20px 56px;
            border-radius: 9999px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 0 var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.075s;
            outline: none;
        }

        .btn:hover { background: #fde047; }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 6px 0 var(--primary-dark);
        }

        .btn-secondary {
            background: white;
            box-shadow: 0 8px 0 #cbd5e1;
            font-size: 20px;
            padding: 18px 48px;
        }

        .btn-secondary:active {
            box-shadow: 0 4px 0 #cbd5e1;
        }

        /* 底部提示样式 */
        .footer-hint {
            margin-top: auto;
            padding: 32px 32px 64px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hint-badge {
            background: var(--primary);
            color: #0f172a;
            font-weight: 900;
            font-size: 18px;
            padding: 16px 40px;
            border-radius: 9999px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 0 var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* SVG 图标样式 */
        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .icon-large { width: 80px; height: 80px; margin-bottom: 20px; color: white; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <!-- 游戏内状态 (HUD) -->
            <div id="hud" class="hud-container" hidden>
                <div class="badge">
                    <svg class="icon" style="color: #f97316" viewBox="0 0 24 24">
                        <path d="M18,2H6A2,2 0 0,0 4,4V7A2,2 0 0,0 6,9H8V11H11V13H8V15H11V17H8V19H6V21H18V19H16V17H13V15H16V13H13V11H16V9H18A2,2 0 0,0 20,7V4A2,2 0 0,0 18,2M18,7H6V4H18V7Z"/>
                    </svg>
                    <div style="display: flex; flex-direction: column;">
                        <span class="badge-label">历史最高</span>
                        <span id="best-score-display" class="badge-value">0</span>
                    </div>
                </div>
                
                <div class="badge-level">
                    <div style="display: flex; flex-direction: column; align-items: flex-end;">
                        <span class="badge-label" style="color: rgba(15,23,42,0.6)">当前层数</span>
                        <span id="current-score-display" class="badge-value">1</span>
                    </div>
                </div>
            </div>

            <!-- 开始界面 -->
            <div id="start-screen" class="screen bg-blur-sky pointer-events-auto">
                <div style="margin-bottom: 32px">
                    <h1 class="title">全民<br><span>堆叠塔</span></h1>
                    <p class="subtitle">挑战极限，堆叠云端！</p>
                </div>
                <button id="start-btn" class="btn">
                    <svg class="icon" style="width: 32px; height: 32px;" viewBox="0 0 24 24">
                        <path d="M8,5.14V19.14L19,12.14L8,5.14Z"/>
                    </svg>
                    <span>开始游戏</span>
                </button>
            </div>

            <!-- 游戏结束界面 -->
            <div id="gameover-screen" class="screen bg-blur-red pointer-events-auto" hidden>
                <svg class="icon icon-large" viewBox="0 0 24 24">
                    <path d="M12,2C6.47,2 2,6.47 2,12C2,17.53 6.47,22 12,22C17.53,22 22,17.53 22,12C22,6.47 17.53,2 12,2M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M15.5,11C16.33,11 17,10.33 17,9.5C17,8.67 16.33,8 15.5,8C14.67,8 14,8.67 14,9.5C14,10.33 14.67,11 15.5,11M8.5,11C9.33,11 10,10.33 10,9.5C10,8.67 9.33,8 8.5,8C7.67,8 7,8.67 7,9.5C7,10.33 7.67,11 8.5,11M12,14C9.43,14 7.27,15.58 6.4,17.8L7.64,18.2C8.29,16.55 9.94,15.5 12,15.5C14.06,15.5 15.71,16.55 16.36,18.2L17.6,17.8C16.73,15.58 14.57,14 12,14Z"/>
                </svg>
                <h2 style="font-size: 48px; font-weight: 900; color: white; margin: 0 0 8px 0; letter-spacing: 2px;">挑战结束！</h2>
                <p id="final-score-text" class="subtitle" style="margin-bottom: 32px">你最终堆叠了 1 层</p>
                
                <button id="retry-btn" class="btn btn-secondary">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/>
                    </svg>
                    <span>再试一次</span>
                </button>
            </div>

            <!-- 操作引导提示 -->
            <div id="footer-hint" class="footer-hint" hidden>
                <div class="hint-badge">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M17.5,12A1.5,1.5 0 0,1 16,10.5A1.5,1.5 0 0,1 17.5,9A1.5,1.5 0 0,1 19,10.5A1.5,1.5 0 0,1 17.5,12M14.5,18A1.5,1.5 0 0,1 13,16.5A1.5,1.5 0 0,1 14.5,15A1.5,1.5 0 0,1 16,16.5A1.5,1.5 0 0,1 14.5,18M9.5,18A1.5,1.5 0 0,1 8,16.5A1.5,1.5 0 0,1 9.5,15A1.5,1.5 0 0,1 11,16.5A1.5,1.5 0 0,1 9.5,18M6.5,12A1.5,1.5 0 0,1 5,10.5A1.5,1.5 0 0,1 6.5,9A1.5,1.5 0 0,1 8,10.5A1.5,1.5 0 0,1 6.5,12M12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22Z"/>
                    </svg>
                    <span>点击放置木块</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /** 
         * 叠叠乐大师 - 纯原生 JavaScript & Canvas 实现
         * 自包含：无需任何外部资源。
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        // DOM 元素引用
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const hud = document.getElementById('hud');
        const footerHint = document.getElementById('footer-hint');
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const currentScoreDisplay = document.getElementById('current-score-display');
        const bestScoreDisplay = document.getElementById('best-score-display');
        const finalScoreText = document.getElementById('final-score-text');

        // 游戏常量配置
        const GAME_WIDTH = 400;     // 逻辑宽度
        const GAME_HEIGHT = 800;    // 逻辑高度
        const BLOCK_HEIGHT = 50;    // 木块高度
        const INITIAL_BLOCK_WIDTH = 150; // 初始木块宽度
        const SWING_SPEED_BASE = 0.025;  // 基础摇摆速度
        const FALL_SPEED = 12;      // 木块下落速度
        const COLORS = ['#3b82f6', '#fb923c', '#10b981', '#a855f7', '#ec4899', '#f43f5e', '#06b6d4']; // 木块颜色池

        // 游戏运行时状态
        let gameState = 'START';    // 游戏状态: START, PLAYING, GAMEOVER
        let score = 0;              // 当前分数（层数）
        let bestScore = parseInt(localStorage.getItem('tower-stack-best') || '0'); // 本地存储的历史最高分
        let blocks = [];            // 已固定的木块列表
        let activeBlock = null;     // 当前正在移动/下落的木块
        let clouds = [];            // 背景云朵列表
        let swingAngle = 0;         // 摇摆角度（正弦波控制）
        let scrollOffset = 0;       // 当前画布垂直滚动偏移
        let targetScrollOffset = 0; // 画布滚动的目标偏移

        /** 
         * 调整画布尺寸
         */
        function resize() {
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
        }

        window.addEventListener('resize', resize);
        resize();

        /** 
         * 初始化游戏数据
         */
        function initGame() {
            score = 0;
            scrollOffset = 0;
            targetScrollOffset = 0;
            swingAngle = 0;
            
            // 创建地基
            blocks = [{
                x: GAME_WIDTH / 2 - INITIAL_BLOCK_WIDTH / 2,
                y: GAME_HEIGHT - 100,
                width: INITIAL_BLOCK_WIDTH,
                height: BLOCK_HEIGHT,
                color: '#334155',
                isStable: true,
                velocity: 0
            }];

            // 随机生成装饰云朵
            clouds = Array.from({ length: 6 }, () => ({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                scale: 0.5 + Math.random() * 1.5,
                speed: 0.2 + Math.random() * 0.5
            }));

            createNewActiveBlock();
            updateUI();
        }

        /** 
         * 生成一个新的活动木块
         */
        function createNewActiveBlock() {
            const lastBlock = blocks[blocks.length - 1];
            activeBlock = {
                x: GAME_WIDTH / 2,
                y: 150, // 从屏幕上方固定位置开始摆动
                width: lastBlock.width, // 宽度继承自上一个木块（被切割后的宽度）
                height: BLOCK_HEIGHT,
                color: COLORS[score % COLORS.length],
                isStable: false,
                velocity: 0
            };
        }

        /** 
         * 更新 UI 界面状态
         */
        function updateUI() {
            bestScoreDisplay.textContent = bestScore;
            currentScoreDisplay.textContent = score + 1;
            
            startScreen.hidden = gameState !== 'START';
            gameoverScreen.hidden = gameState !== 'GAMEOVER';
            hud.hidden = gameState === 'START';
            footerHint.hidden = gameState !== 'PLAYING';

            if (gameState === 'GAMEOVER') {
                finalScoreText.textContent = `你最终堆叠了 ${score + 1} 层`;
            }
        }

        /** 
         * 开始游戏逻辑
         */
        function startGame() {
            gameState = 'PLAYING';
            initGame();
        }

        /** 
         * 游戏结束处理
         */
        function gameOver() {
            gameState = 'GAMEOVER';
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('tower-stack-best', bestScore);
            }
            updateUI();
        }

        /** 
         * 每一帧的逻辑更新
         */
        function update() {
            if (gameState !== 'PLAYING') return;

            // 1. 处理活动木块的水平摇摆
            if (activeBlock && activeBlock.velocity === 0) {
                // 随着层数增加，摆动速度稍微加快
                swingAngle += SWING_SPEED_BASE + (score * 0.001);
                const range = (GAME_WIDTH / 2) - 40;
                activeBlock.x = GAME_WIDTH / 2 + Math.sin(swingAngle) * range - activeBlock.width / 2;
            }

            // 2. 处理活动木块的下落
            if (activeBlock && activeBlock.velocity > 0) {
                activeBlock.y += activeBlock.velocity;
                
                const lastBlock = blocks[blocks.length - 1];
                const collisionY = lastBlock.y - BLOCK_HEIGHT;

                // 检测是否到达碰撞平面
                if (activeBlock.y >= collisionY) {
                    const landingX = activeBlock.x;
                    // 计算重合区域
                    const overlapStart = Math.max(landingX, lastBlock.x);
                    const overlapEnd = Math.min(landingX + activeBlock.width, lastBlock.x + lastBlock.width);
                    const overlapWidth = overlapEnd - overlapStart;

                    if (overlapWidth > 10) {
                        // 成功着陆
                        activeBlock.y = collisionY;
                        activeBlock.x = overlapStart;
                        activeBlock.width = overlapWidth; // 切割木块：宽度只保留重合部分
                        activeBlock.isStable = true;
                        activeBlock.velocity = 0;
                        
                        blocks.push(activeBlock);
                        score++;
                        updateUI();

                        // 当塔足够高时，向上滚动相机
                        if (blocks.length > 5) {
                            targetScrollOffset = (blocks.length - 5) * BLOCK_HEIGHT;
                        }

                        createNewActiveBlock();
                    } else {
                        // 未对准或重合太少，游戏结束
                        gameOver();
                    }
                }
            }

            // 3. 处理平滑滚动效果
            scrollOffset += (targetScrollOffset - scrollOffset) * 0.1;

            // 4. 更新云朵位置
            clouds.forEach(cloud => {
                cloud.x += cloud.speed;
                if (cloud.x > GAME_WIDTH + 100) cloud.x = -100;
            });
        }

        /** 
         * 每一帧的画面渲染
         */
        function draw() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 绘制天空背景渐变
            const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            grad.addColorStop(0, '#7dd3fc');
            grad.addColorStop(1, '#e0f2fe');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.save();
            // 应用垂直滚动偏移
            ctx.translate(0, scrollOffset);

            // 绘制云朵 (带简单的视差效果)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            clouds.forEach(cloud => {
                const cx = cloud.x;
                const cy = cloud.y - scrollOffset * 0.5; // 视差滚动
                ctx.beginPath();
                ctx.arc(cx, cy, 20 * cloud.scale, 0, Math.PI * 2);
                ctx.arc(cx + 25 * cloud.scale, cy, 15 * cloud.scale, 0, Math.PI * 2);
                ctx.arc(cx - 20 * cloud.scale, cy + 5 * cloud.scale, 12 * cloud.scale, 0, Math.PI * 2);
                ctx.fill();
            });

            // 绘制吊绳 (仅在木块摇摆阶段显示)
            if (activeBlock && activeBlock.velocity === 0) {
                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(GAME_WIDTH / 2, -500); // 从天空上方垂下
                ctx.lineTo(activeBlock.x + activeBlock.width / 2, activeBlock.y);
                ctx.stroke();
            }

            // 绘制所有已固定的木块
            blocks.forEach(block => drawBlock(block));
            // 绘制当前的活动木块
            if (activeBlock) drawBlock(activeBlock);

            ctx.restore();
        }

        /** 
         * 绘制单个木块的视觉细节
         */
        function drawBlock(block) {
            const r = 10; // 圆角大小
            ctx.fillStyle = block.color;
            
            // 绘制主体
            ctx.beginPath();
            ctx.roundRect(block.x, block.y, block.width, block.height, r);
            ctx.fill();

            // 绘制顶部的反光层（增加质感）
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.roundRect(block.x, block.y, block.width, block.height / 3, [r, r, 0, 0]);
            ctx.fill();

            // 绘制底部的阴影层（增加立体感）
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            ctx.roundRect(block.x, block.y + block.height - 6, block.width, 6, [0, 0, r, r]);
            ctx.fill();
        }

        /** 
         * 游戏主循环
         */
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        /** 
         * 处理玩家输入动作 (点击屏幕让木块下落)
         */
        function handleAction() {
            if (gameState === 'PLAYING' && activeBlock && activeBlock.velocity === 0) {
                activeBlock.velocity = FALL_SPEED; // 赋予下落速度
            }
        }

        // 事件监听
        container.addEventListener('mousedown', handleAction);
        container.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 防止移动端双击缩放
            handleAction();
        }, { passive: false });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        retryBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        // 启动程序
        updateUI();
        loop();
    </script>
</body>
</html>
